---
bugfixes:
  - operations - fix default() usage for django_manage_get_cmd in
    get_db_credentials.yml so an explicit null (controller/eda/gateway)
    falls through to a real default manage-shell command instead of
    rendering as an empty string. default(omit) only substitutes for
    undefined variables, not explicit null, and omit itself doesn't work
    here since the value is interpolated inside a larger command string
    in db_auth.yml rather than passed as a standalone module parameter -
    needs the same literal string default db_export.yml already uses. The
    empty value produced an empty -c '' argument to the Django manage
    shell, causing the DB settings introspection to return nothing during
    containerized import's credential discovery.
