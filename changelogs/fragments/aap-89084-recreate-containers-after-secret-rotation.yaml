---
bugfixes:
  - operations - Recreate each component's containers, on every node, after
    its encryption secret is rotated during containerized import. Podman
    secrets aren't refreshed by a plain restart, so containers kept serving
    a stale key against the freshly restored database, causing gateway
    `migrate` to fail with `cryptography.fernet.InvalidToken` and hub Pulp
    repair to fail.
