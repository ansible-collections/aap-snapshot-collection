---
minor_changes:
  - "automationhub - move the Hub Pulp storage backend check for OCP hub
    content import earlier, before the artifact is staged and AAP is idled,
    instead of failing deep into the import after the controller and hub
    databases were already restored. A non-FileSystem backend (Azure Blob
    or AWS S3) is now caught immediately, matching the fail-fast behavior
    already in place for containerized imports."
