---
bugfixes:
  - artifact - discover each component's DB credentials before stopping
    services during containerized import, not after. Credential discovery
    uses podman_container_exec into the component's own app container,
    which requires it to be running - consume.yml previously stopped all
    services first, causing "can only create exec sessions on running
    containers" once import reached the credential lookup step.
    get_db_credentials.yml now caches its result so the later, post-stop
    call from each component's import.yml is a no-op.
