---
bugfixes:
  - operations - restore each component's resource server podman secret
    (controller_resource_server, eda_resource_server, hub_resource_server)
    during containerized import. Export already captures these
    (get_secret.yml reads them into the artifact as
    {component}_resource_key), but nothing restored them on import - the
    podman secret was left missing or stale, causing any awx-manage,
    aap-eda-manage, or pulpcore-manager shell command against that
    component's container to fail with a "no such secret" podman error.
