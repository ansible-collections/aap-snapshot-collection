---
bugfixes:
  - preflight - further scope the gateway status health gate
    (``check_gateway_status.yml``) to only the in-scope backends
    (controller, hub, eda) that are actually deployed on the target,
    instead of the static ``preflight_in_scope_gateway_services`` list.
    Hub and eda can be disabled on a given AAP instance; previously the
    health gate still demanded a 'good' status for them even when they
    were intentionally absent, which could hard-fail preflight on an
    otherwise healthy target. On RPM/containerized targets the in-scope
    list is now derived directly from non-empty inventory groups, so it
    self-updates as components are added or disabled with no changes
    needed to ``preflight_in_scope_gateway_services``; on operator (OCP)
    targets it is computed from discovered component CRs and intersected
    with that var, since OCP component discovery isn't backed by a
    uniform group structure.
