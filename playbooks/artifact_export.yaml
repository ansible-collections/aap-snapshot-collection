---
- name: Preflight Tasks
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  max_fail_percentage: 0
  environment: "{{ ocp_utils_ocp_environment | default({}) }}"
  tasks:
    - name: Set Common Groups
      ansible.builtin.include_role:
        name: ansible.aap_snapshot.common
        tasks_from: set_groups.yml
      when: aap_platform != 'operator'

    - name: Running Preflight
      ansible.builtin.include_role:
        name: ansible.aap_snapshot.preflight
        tasks_from: main.yml
      when: aap_platform != 'operator'

- name: Preflight OCP source
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  max_fail_percentage: 0
  environment: "{{ ocp_utils_ocp_environment | default({}) }}"
  tasks:
    - name: Run OCP source preflight
      ansible.builtin.include_role:
        name: ansible.aap_snapshot.preflight
        tasks_from: main.yml
      when: aap_platform == 'operator'

    - name: Set OCP export components
      ansible.builtin.include_role:
        name: ansible.aap_snapshot.ocp_utils
        tasks_from: set_export_components.yml
      when: aap_platform == 'operator'

    - name: Pre-flight Automation Controller on OCP source
      ansible.builtin.include_role:
        name: ansible.aap_snapshot.automationcontroller
        tasks_from: preflight.yml
      when:
        - aap_platform == 'operator'
        - "'controller' in _artifact_export_components"

    - name: Pre-flight Automation EDA on OCP source
      ansible.builtin.include_role:
        name: ansible.aap_snapshot.automationeda
        tasks_from: preflight.yml
      when:
        - aap_platform == 'operator'
        - "'eda' in _artifact_export_components"

    - name: Pre-flight Automation Gateway on OCP source
      ansible.builtin.include_role:
        name: ansible.aap_snapshot.automationgateway
        tasks_from: preflight.yml
      when:
        - aap_platform == 'operator'
        - "'gateway' in _artifact_export_components"

    - name: Pre-flight Automation Hub on OCP source
      ansible.builtin.include_role:
        name: ansible.aap_snapshot.automationhub
        tasks_from: preflight.yml
      when:
        - aap_platform == 'operator'
        - "'hub' in _artifact_export_components"

- name: Initialize artifact
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:
    - name: Initialize artifact locally
      ansible.builtin.include_role:
        name: ansible.aap_snapshot.artifact
        tasks_from: init.yml

- name: Export into artifact
  hosts: controller_groups:eda_groups:gateway_groups:hub_groups
  gather_facts: false
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:
    - name: Export components into artifact
      ansible.builtin.include_role:
        name: ansible.aap_snapshot.artifact
        tasks_from: build.yml
      when: aap_platform != 'operator'

- name: Export OCP components into artifact
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:
    - name: Export OCP components into artifact
      ansible.builtin.include_role:
        name: ansible.aap_snapshot.artifact
        tasks_from: build_ocp.yml
      when: aap_platform == 'operator'

- name: Package artifact
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:
    - name: Package artifact locally
      ansible.builtin.include_role:
        name: ansible.aap_snapshot.artifact
        tasks_from: package.yml

- name: Validate artifact
  ansible.builtin.import_playbook: common/validate_artifact.yaml
...
