---
- name: Extract artifact archive
  ansible.builtin.unarchive:
    src: "{{ artifact_dir }}/{{ artifact_filename }}"
    dest: "{{ artifact_dir }}"

- name: Validate extracted artifact
  ansible.aap_snapshot.validate_migration_artifact:
    artifact_dir: "{{ artifact_dir }}/artifact"
    target_aap_version: "{{ target_aap_version | default(omit) }}"
  register: _artifact_validation

- name: Print validation report
  ansible.builtin.debug:
    msg: "{{ _artifact_validation.report }}"

- name: Load artifact secrets
  ansible.builtin.include_vars:
    file: "{{ artifact_dir }}/artifact/secrets.yml"
    name: artifact_secrets

- name: Load artifact manifest
  ansible.builtin.include_vars:
    file: "{{ artifact_dir }}/artifact/manifest.yml"
    name: artifact_manifest

- name: Determine whether to restore PostgreSQL dumps
  ansible.builtin.set_fact:
    _artifact_do_postgresql_import: >-
      {{ (not (artifact_skip_postgres | default(false) | bool))
         and (artifact_manifest.database.has_dumps | default(true) | bool) }}

- name: Warn when explicitly discarding PostgreSQL dumps present in the artifact
  ansible.builtin.debug:
    msg: >-
      WARNING: artifact_skip_postgres=true was set, but this artifact contains
      PostgreSQL dumps (database.has_dumps: true). The target database(s) will
      be left untouched - dumps in the artifact will NOT be restored. If this
      is unintentional, re-run without artifact_skip_postgres=true.
  when:
    - artifact_skip_postgres | default(false) | bool
    - artifact_manifest.database.has_dumps | default(true) | bool
