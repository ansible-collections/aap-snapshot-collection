---
- name: Stat artifact_dest_dir
  ansible.builtin.stat:
    path: '{{ artifact_dest_dir }}'
  register: _artifact_dest_dir_stat

- name: Validate artifact_dest_dir exists and is a directory
  ansible.builtin.fail:
    msg: >-
      artifact_dest_dir '{{ artifact_dest_dir }}' does not exist or is not a directory.
      Create it first or pass an absolute path to an existing directory,
      e.g. -e artifact_dest_dir=/tmp/snapshots
  when: not _artifact_dest_dir_stat.stat.exists or not _artifact_dest_dir_stat.stat.isdir

- name: Stat artifact_build_dir parent
  ansible.builtin.stat:
    path: '{{ __artifact_build_dir | dirname }}'
  register: _artifact_build_dir_parent_stat

- name: Validate artifact_build_dir parent exists and is a directory
  ansible.builtin.fail:
    msg: >-
      Parent directory of artifact_build_dir '{{ __artifact_build_dir | dirname }}' does not exist
      or is not a directory. Pass an absolute path whose parent exists,
      e.g. -e artifact_build_dir=/tmp/artifact-build
  when: not _artifact_build_dir_parent_stat.stat.exists or not _artifact_build_dir_parent_stat.stat.isdir

- name: Ensure artifact directory is clear before initialized
  ansible.builtin.file:
    path: '{{ __artifact_build_dir }}'
    state: absent

- name: Set artifact timestamp facts
  ansible.builtin.set_fact:
    artifact_timestamp: '{{ now(utc=true, fmt="%Y-%m-%dT%H:%M:%SZ") }}'
    artifact_date: '{{ now(utc=true, fmt="%Y%m%d-%H%M%S") }}'

- name: Initialize artifact directory
  ansible.builtin.file:
    path: '{{ __artifact_build_dir }}'
    state: directory
    mode: '0750'

- name: Initialize gateway directory
  ansible.builtin.file:
    path: '{{ __artifact_build_dir }}/gateway/'
    state: directory
    mode: '0750'
  when: groups.get('gateway_groups', []) | length > 0

- name: Initialize controller directory
  ansible.builtin.file:
    path: '{{ __artifact_build_dir }}/controller/'
    state: directory
    mode: '0750'
  when: groups.get('controller_groups', []) | length > 0

- name: Initialize custom_configs for controller
  ansible.builtin.file:
    path: '{{ __artifact_build_dir }}/controller/custom_configs/{{ item }}'
    state: directory
    mode: '0750'
  loop: '{{ groups.get("controller_groups", []) }}'
  loop_control:
    label: "{{ item }}"
  when:
    - groups.get('controller_groups', []) | length > 0
    - aap_platform | default('') == 'rpm'

- name: Initialize hub directory
  ansible.builtin.file:
    path: '{{ __artifact_build_dir }}/hub/'
    state: directory
    mode: '0750'
  when: groups.get('hub_groups', []) | length > 0

- name: Initialize eda directory
  ansible.builtin.file:
    path: '{{ __artifact_build_dir }}/eda/'
    state: directory
    mode: '0750'
  when: groups.get('eda_groups', []) | length > 0

# Component export tasks reference __artifact_build_dir on their own
# remote hosts several include_role levels deep - broadcast it as a fact
# rather than relying on each host re-deriving the role default.
- name: Broadcast artifact build directory to component hosts
  ansible.builtin.set_fact:
    __artifact_build_dir: "{{ __artifact_build_dir }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: >-
    {{ (groups.get('controller_groups', [])
        + groups.get('eda_groups', [])
        + groups.get('gateway_groups', [])
        + groups.get('hub_groups', []))
       | unique }}
  loop_control:
    label: "{{ item }}"
...
