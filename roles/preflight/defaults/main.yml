---
__preflight_no_log: "{{ not (disable_no_log | default(false) | bool) }}"

preflight_ocp_namespace: "{{ ocp_namespace | default('aap') }}"
preflight_aap_instance_name: "{{ aap_instance_name | default('aap') }}"
preflight_aap_cr_kind: "AnsibleAutomationPlatform"
preflight_operator_namespace: "{{ preflight_ocp_namespace }}"
preflight_aap_cr_api_version: "aap.ansible.com/v1alpha1"
preflight_controller_manage_cmd: "awx-manage"
preflight_gateway_manage_cmd: "aap-gateway-manage"

# The gateway's own /api/gateway/v1/status/ endpoint reports on every backend
# it knows about (controller, hub, eda, lightspeed, metrics, redis, ...), but
# this collection only exports/imports controller, hub, eda, and gateway
# itself. Scope the health gate to those so preflight isn't blocked by an
# unhealthy out-of-scope service (e.g. redis, lightspeed) that this collection
# never touches.
#
# On RPM/containerized targets, the in-scope list is instead derived directly
# from non-empty inventory groups (see check_gateway_status.yml), so this var
# is only consulted on operator (OCP) targets, where component discovery uses
# per-component CR-name facts rather than a uniform group structure.
preflight_in_scope_gateway_services:
  - controller
  - hub
  - eda

preflight_temp_pvc_size: "{{ temp_pvc_size | default('60Gi') }}"

preflight_known_rwx_storage_classes:
  - nfs-local-rwx
  - ocs-storagecluster-cephfs
  - odf-cephfs
  - managed-nfs-storage
  - nfs

preflight_containerized_staging_dir: "{{ ansible_user_dir | default('~') }}/aap/backups/migration"
preflight_containerized_temp_container: "aap-snapshot-restore"
preflight_containerized_postgresql_container: "postgresql"

# Kubeconfig resolution for this role's own OCP checks (check_ocp_target.yml),
# which run before ocp_utils is loaded elsewhere in the play and so can't rely
# on ocp_utils_ocp_environment yet. Mirrors roles/ocp_utils/defaults/main.yml.
__preflight_resolved_kubeconfig: >-
  {{ kubeconfig
     | default(lookup('env', 'K8S_AUTH_KUBECONFIG'), true)
     | default(lookup('env', 'KUBECONFIG'), true)
     | default('', true) }}

preflight_ocp_environment: >-
  {{ {'K8S_AUTH_KUBECONFIG': __preflight_resolved_kubeconfig}
     if (__preflight_resolved_kubeconfig | length > 0)
     else {} }}
...
