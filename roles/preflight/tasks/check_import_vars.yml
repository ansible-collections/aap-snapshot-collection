---
- name: Validate artifact_file on the control node
  run_once: true
  delegate_to: localhost
  block:
    - name: Assert artifact_file is provided
      ansible.builtin.assert:
        that: artifact_file is defined and artifact_file | length > 0
        fail_msg: >-
          artifact_file is required. Pass the artifact path with: -e artifact_file=/path/to/artifact.tar

    - name: Resolve artifact file to absolute path
      ansible.builtin.set_fact:
        _preflight_resolved_artifact: >-
          {{ artifact_file if (artifact_file | first == '/')
             else (lookup('env', 'PWD') ~ '/' ~ artifact_file) }}

    - name: Check artifact path for symlinks
      ansible.builtin.stat:
        path: "{{ _preflight_resolved_artifact }}"
        follow: false
      register: _preflight_artifact_raw

    - name: Resolve symlink to real path
      ansible.builtin.set_fact:
        _preflight_resolved_artifact: "{{ _preflight_artifact_raw.stat.lnk_source }}"
      when: _preflight_artifact_raw.stat.islnk | default(false)

    - name: Check artifact file exists
      ansible.builtin.stat:
        path: "{{ _preflight_resolved_artifact }}"
        follow: true
      register: _preflight_artifact_stat

    - name: Assert artifact file exists
      ansible.builtin.assert:
        that: _preflight_artifact_stat.stat.exists
        fail_msg: >-
          Artifact file not found: {{ _preflight_resolved_artifact }}.
          Pass the artifact path with: -e artifact_file=/path/to/artifact.tar

    - name: Peek artifact manifest for database dump presence
      ansible.builtin.command:
        argv:
          - tar
          - -xOf
          - "{{ _preflight_resolved_artifact }}"
          - artifact/manifest.yml
      register: _preflight_manifest_peek
      changed_when: false
      failed_when: false

    - name: Parse peeked artifact manifest
      ansible.builtin.set_fact:
        _preflight_peeked_manifest: "{{ _preflight_manifest_peek.stdout | from_yaml }}"
      when:
        - _preflight_manifest_peek.rc == 0
        - _preflight_manifest_peek.stdout | default('') | length > 0
      delegate_to: localhost
      delegate_facts: true

    - name: Record whether artifact includes PostgreSQL dumps
      ansible.builtin.set_fact:
        _preflight_artifact_has_dumps: "{{ _preflight_peeked_manifest.database.has_dumps | default(true) | bool }}"
        _preflight_artifact_has_hub_content: >-
          {{ (
               _preflight_peeked_manifest.components | default([])
               | selectattr('name', 'equalto', 'hub')
               | map(attribute='has_content_data')
               | list | first | default(false)
             ) | bool }}
      when: _preflight_peeked_manifest is defined
      delegate_to: localhost
      delegate_facts: true

    - name: Default dump presence when manifest peek is unavailable
      ansible.builtin.set_fact:
        _preflight_artifact_has_dumps: true
        _preflight_artifact_has_hub_content: false
      when: _preflight_peeked_manifest is not defined
      delegate_to: localhost
      delegate_facts: true
...
