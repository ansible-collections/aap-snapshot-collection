---
- name: Validate database migration interface before changes
  ansible.builtin.assert:
    that:
      - (postgres_skip_data | default(false) | bool) | ansible.aap_snapshot.snapshot_manual_interface(
          artifact_import_phase | default('all'), aap_platform | default(''),
          _snapshot_operation | default('export'), artifact_source_quiesced | default(false) | bool)

- name: Run standard preflight
  ansible.builtin.include_tasks: automatic.yml
  when: not (postgres_skip_data | default(false) | bool)

- name: Run maintenance-aware RPM source preflight
  ansible.builtin.include_tasks: manual_source.yml
  when:
    - postgres_skip_data | default(false) | bool
    - _snapshot_operation | default('export') == 'export'
...
