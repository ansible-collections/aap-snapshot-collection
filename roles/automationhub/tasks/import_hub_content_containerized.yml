---
# Containerized equivalent of import_hub_content.yml (OCP). Extracts the
# hub content tarball - staged to this host by
# artifact/tasks/transfer_hub_content.yml - into this host's own Pulp
# FileSystem media directory. Runs on every hub host: each node has its
# own independent storage, unlike OCP's single shared PVC, so every node
# needs its own copy restored to serve downloads correctly.
#
# By the time this runs, roles/automationhub/tasks/check_storage_backend.yml
# has already confirmed (or failed the run) that this hub is FileSystem-backed
# - no storage-type check is repeated here.
- name: Restore hub content (containerized)
  when:
    - aap_platform == 'containerized'
    - automationhub_import_hub_content | default(true) | bool
    - artifact_hub_has_content_data | default(false) | bool
    - inventory_hostname in groups.get('hub_groups', [])
  block:
    - name: Check if hub content tarball was staged on this host
      ansible.builtin.stat:
        path: "{{ preflight_containerized_staging_dir }}/artifact/hub/{{ automationhub_content_tar_name }}"
      register: _automationhub_staged_content_stat

    - name: Extract hub content tarball on this host
      when: _automationhub_staged_content_stat.stat.exists
      block:
        - name: Get hub container details
          containers.podman.podman_container_info:
            name: automation-hub-api
          register: _automationhub_content_container

        - name: Resolve hub data path from container mounts
          ansible.builtin.set_fact:
            _automationhub_content_data_path: >-
              {{ _automationhub_content_container.containers[0].Mounts
                 | selectattr('Destination', 'equalto', '/var/lib/pulp')
                 | map(attribute='Source') | first }}

        # Disk-headroom check, done here (not in preflight/check_containerized_target.yml)
        # because the artifact hasn't been extracted yet when that file runs -
        # artifact_manifest and the staged tarball's real size are only available
        # once staging has already happened, at this point in the flow.
        - name: Check available disk space on hub content destination filesystem
          ansible.builtin.command:
            cmd: "df -Pk {{ _automationhub_content_data_path }}"
          changed_when: false
          register: _automationhub_content_disk_free

        - name: Determine required and available space for hub content extraction
          ansible.builtin.set_fact:
            # Available is always 3rd-from-last in POSIX `df -Pk` output,
            # whether or not a long device name forced the stats onto their
            # own line (split()[3] would grab Use% instead of Available in
            # that wrapped case, making this check always fail).
            _automationhub_content_available_kb: "{{ _automationhub_content_disk_free.stdout_lines[-1].split()[-3] | int }}"
            # Require at least 2x the staged tarball size: peak usage is the
            # staged tarball plus its extracted content until the tarball is
            # removed right after extraction below.
            _automationhub_content_required_kb: "{{ ((_automationhub_staged_content_stat.stat.size / 1024) * 2) | round(0, 'ceil') | int }}"

        - name: Fail if insufficient disk space for hub content extraction
          ansible.builtin.fail:
            msg: >-
              Insufficient disk space on {{ inventory_hostname }} to extract hub
              content: {{ _automationhub_content_available_kb }}KB available at
              {{ _automationhub_content_data_path }}, but at least
              {{ _automationhub_content_required_kb }}KB is needed (2x the staged
              {{ ((_automationhub_staged_content_stat.stat.size / 1024 / 1024) | round(1)) }}MB
              tarball, to cover both the staged tarball and its extracted content
              before cleanup). Free up space on this host's Pulp storage
              filesystem before retrying, or set
              automationhub_import_hub_content=false to skip content restore
              and sync it manually instead.
          when: (_automationhub_content_available_kb | int) < (_automationhub_content_required_kb | int)

        # remote_src (not become) - extracting as ansible_user leaves files
        # owned by the same rootless UID the hub container maps to. Adding
        # become here would write root-owned blobs the pulp process inside
        # the container can't read.
        - name: Extract hub content tarball into Pulp media directory
          ansible.builtin.unarchive:
            src: "{{ preflight_containerized_staging_dir }}/artifact/hub/{{ automationhub_content_tar_name }}"
            dest: "{{ _automationhub_content_data_path }}/media/"
            remote_src: true

        - name: Record that hub content was restored
          ansible.builtin.set_fact:
            _automationhub_content_restored: true
          delegate_to: localhost
          delegate_facts: true

        - name: Remove staged hub content tarball
          ansible.builtin.file:
            path: "{{ preflight_containerized_staging_dir }}/artifact/hub/{{ automationhub_content_tar_name }}"
            state: absent
...
