---
# Inspect the containerized Hub storage backend. Content import still
# requires local FileSystem storage; source exports using Azure Blob or S3
# skip the content archive because those files live outside the local media
# directory.
- name: Determine Hub Pulp storage backend
  containers.podman.podman_container_exec:
    name: automation-hub-api
    # settings.STORAGES is a dynaconf Box, not a plain dict - its repr
    # (`<Box: {...}>`) isn't valid YAML/JSON, so convert it explicitly and
    # emit real JSON rather than a Python repr (same class of bug as the
    # original BUG-1 in db_auth.yml).
    command: >-
      pulpcore-manager shell -c
      "import json; from django.conf import settings; s = getattr(settings, 'STORAGES', None); s = s.to_dict() if hasattr(s, 'to_dict') else s; print(json.dumps({'STORAGES': s, 'DEFAULT_FILE_STORAGE': getattr(settings, 'DEFAULT_FILE_STORAGE', None)}))"
  changed_when: false
  no_log: "{{ not (disable_no_log | default(false) | bool) }}"
  register: _automationhub_storage_dump

- name: Parse Hub storage backend settings
  ansible.builtin.set_fact:
    _automationhub_storage_settings: "{{ (_automationhub_storage_dump.stdout | trim) | from_json }}"
  no_log: "{{ not (disable_no_log | default(false) | bool) }}"

- name: Resolve Hub's configured storage backend class
  ansible.builtin.set_fact:
    _automationhub_storage_backend: >-
      {{ ((_automationhub_storage_settings.STORAGES.default.BACKEND | default(''))
          if (_automationhub_storage_settings.STORAGES | default(none)) is mapping
          else (_automationhub_storage_settings.DEFAULT_FILE_STORAGE | default(''))) }}

- name: Skip Hub content export for object storage (containerized)
  ansible.builtin.set_fact:
    automationhub_export_hub_content: false
    _automationhub_skip_hub_content_export: true
  when:
    - _automationhub_storage_backend_check_mode | default('import') == 'export'
    - (_automationhub_storage_backend | lower) is search('azure|s3')

- name: Fail if Hub is not using local FileSystem storage
  ansible.builtin.fail:
    msg: >-
      Hub on {{ inventory_hostname }} is configured with storage backend
      '{{ _automationhub_storage_backend }}'. Containerized hub content
      import currently only supports Pulp's local FileSystem storage.
      Importing hub content into an Azure Blob or AWS S3-backed hub is not
      yet implemented and is tracked separately - re-run the import without
      hub content, or wait for object-storage import support to land,
      before importing hub content onto this target.
  when:
    - "'filesystem' not in (_automationhub_storage_backend | lower)"
    - not (
        (_automationhub_storage_backend_check_mode | default('import') == 'export')
        and ((_automationhub_storage_backend | lower) is search('azure|s3'))
      )
...
