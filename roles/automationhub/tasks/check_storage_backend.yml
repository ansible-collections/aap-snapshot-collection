---
# Containerized hub content import only supports Pulp's default local
# FileSystem storage today. A containerized hub CAN be deployed with a
# shared Azure Blob or AWS S3 backend instead - importing content into
# those backends is a separate, not-yet-implemented feature. Fail loudly
# and early (before any destructive stop/restore work starts) rather than
# silently restoring only the Pulp database and leaving every migrated
# collection un-downloadable.
- name: Determine Hub Pulp storage backend
  containers.podman.podman_container_exec:
    name: automation-hub-api
    command: >-
      pulpcore-manager shell -c
      "from django.conf import settings; print({'STORAGES': getattr(settings, 'STORAGES', None), 'DEFAULT_FILE_STORAGE': getattr(settings, 'DEFAULT_FILE_STORAGE', None)})"
  changed_when: false
  register: _automationhub_storage_dump

- name: Parse Hub storage backend settings
  ansible.builtin.set_fact:
    _automationhub_storage_settings: "{{ (_automationhub_storage_dump.stdout | trim) | from_yaml }}"

- name: Resolve Hub's configured storage backend class
  ansible.builtin.set_fact:
    _automationhub_storage_backend: >-
      {{ ((_automationhub_storage_settings.STORAGES.default.BACKEND | default(''))
          if (_automationhub_storage_settings.STORAGES | default(none)) is mapping
          else (_automationhub_storage_settings.DEFAULT_FILE_STORAGE | default(''))) }}

- name: Fail if Hub is not using local FileSystem storage
  ansible.builtin.fail:
    msg: >-
      Hub on {{ inventory_hostname }} is configured with storage backend
      '{{ _automationhub_storage_backend }}'. Containerized hub content
      import currently only supports Pulp's local FileSystem storage.
      Importing hub content into an Azure Blob or AWS S3-backed hub is not
      yet implemented and is tracked separately - re-run the import without
      hub content, or wait for object-storage import support to land,
      before importing hub content onto this target.
  when: "'filesystem' not in (_automationhub_storage_backend | lower)"
...
