---
- name: Get version for hub
  ansible.builtin.include_role:
    name: ansible.aap_snapshot.operations
    tasks_from: get_version.yml
  vars:
    component_name: "{{ automationhub_component_name }}"

- name: Export secrets for hub
  ansible.builtin.include_role:
    name: ansible.aap_snapshot.operations
    tasks_from: get_secret.yml
  vars:
    component_name: "{{ automationhub_component_name }}"

- name: Export database for hub
  ansible.builtin.include_role:
    name: ansible.aap_snapshot.operations
    tasks_from: db_export.yml
  vars:
    component_name: "{{ automationhub_component_name }}"
    postgresql_export_dest: "{{ __artifact_build_dir }}"

- name: Export hub content data
  ansible.builtin.include_tasks: export_hub_content.yml
  when: automationhub_export_hub_content | default(true) | bool

- name: Report Hub content export disabled by configuration
  ansible.builtin.debug:
    msg: >-
      Hub content export is skipped because automationhub_export_hub_content
      is false.
  when:
    - not (automationhub_export_hub_content | default(true) | bool)
    - not (_automationhub_skip_hub_content_export | default(false) | bool)

- name: Record skipped Hub content export for artifact reports
  ansible.builtin.set_fact:
    artifact_hub_content_export_skipped: true
    artifact_hub_content_skip_reason: >-
      {{ ('Source Hub uses object-storage backend ' ~ _automationhub_storage_backend)
         if (_automationhub_skip_hub_content_export | default(false) | bool)
         else 'Hub content export disabled by configuration' }}
  delegate_to: localhost
  delegate_facts: true
  when: not (automationhub_export_hub_content | default(true) | bool)
...
