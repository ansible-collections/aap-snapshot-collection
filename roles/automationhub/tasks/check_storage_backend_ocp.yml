---
# OCP equivalent of check_storage_backend.yml - execs into the hub pod via
# kubernetes.core.k8s_exec instead of a local podman container. Used before
# importing or exporting Hub content so unsupported object storage fails
# before content transfer begins.
- name: Assert hub pod was discovered for storage backend check
  ansible.builtin.assert:
    that: _ocp_utils_hub_pod_name is defined
    fail_msg: >-
      No running hub pod found in namespace {{ automationhub_ocp_namespace }}
      for hub CR '{{ _hub_cr_name }}'. The Pulp storage backend must be
      verified before importing hub content - bring the hub pod to Running
      and retry.

- name: Determine Hub Pulp storage backend (OCP)
  kubernetes.core.k8s_exec:
    namespace: "{{ automationhub_ocp_namespace }}"
    pod: "{{ _ocp_utils_hub_pod_name }}"
    container: "{{ _ocp_utils_hub_container_name }}"
    # settings.STORAGES is a dynaconf Box, not a plain dict - its repr
    # (`<Box: {...}>`) isn't valid YAML/JSON, so convert it explicitly and
    # emit real JSON rather than a Python repr (same class of bug as the
    # original BUG-1 in db_auth.yml).
    command: >-
      pulpcore-manager shell -c
      "import json; from django.conf import settings; s = getattr(settings, 'STORAGES', None); s = s.to_dict() if hasattr(s, 'to_dict') else s; print(json.dumps({'STORAGES': s, 'DEFAULT_FILE_STORAGE': getattr(settings, 'DEFAULT_FILE_STORAGE', None)}))"
  environment: "{{ automationhub_ocp_environment }}"
  changed_when: false
  # k8s_exec never fails the task on its own - it always exit_json()s with
  # whatever rc the command produced, unlike podman_container_exec (used by
  # the containerized version of this check).
  failed_when: _automationhub_storage_dump.rc != 0
  no_log: "{{ not (disable_no_log | default(false) | bool) }}"
  register: _automationhub_storage_dump

- name: Parse Hub storage backend settings (OCP)
  ansible.builtin.set_fact:
    _automationhub_storage_settings: "{{ (_automationhub_storage_dump.stdout | trim) | from_json }}"
  no_log: "{{ not (disable_no_log | default(false) | bool) }}"

- name: Resolve Hub's configured storage backend class (OCP)
  ansible.builtin.set_fact:
    _automationhub_storage_backend: >-
      {{ ((_automationhub_storage_settings.STORAGES.default.BACKEND | default(''))
          if (_automationhub_storage_settings.STORAGES | default(none)) is mapping
          else (_automationhub_storage_settings.DEFAULT_FILE_STORAGE | default(''))) }}

- name: Fail if Hub is not using local FileSystem storage (OCP)
  ansible.builtin.fail:
    msg: >-
      Hub CR '{{ _hub_cr_name }}' in namespace {{ automationhub_ocp_namespace }}
      is configured with storage backend '{{ _automationhub_storage_backend }}'.
      Hub content export and import currently support Pulp's local FileSystem
      storage (backed by a PVC). OCP artifact export cannot package content
      from Azure Blob or AWS S3 storage. Set artifact_export_hub_content=false
      to export without Hub content.
  when: "'filesystem' not in (_automationhub_storage_backend | lower)"
...
