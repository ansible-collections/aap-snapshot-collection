---
- name: Discover hub file-storage PVC
  kubernetes.core.k8s_info:
    kind: PersistentVolumeClaim
    namespace: "{{ automationhub_ocp_namespace }}"
    label_selectors:
      - "app.kubernetes.io/name=automationhub-storage"
      - "app.kubernetes.io/managed-by=automationhub-operator"
      - "app.kubernetes.io/instance=automationhub-storage-{{ _hub_cr_name }}"
  register: _automationhub_file_storage_pvcs

- name: Assert hub file-storage PVC was found
  ansible.builtin.assert:
    that: _automationhub_file_storage_pvcs.resources | length > 0
    fail_msg: >-
      No hub file-storage PVC found in namespace {{ automationhub_ocp_namespace }}
      for hub instance {{ _hub_cr_name }}, even though Hub's Pulp storage
      backend was already confirmed to be FileSystem-based. Check that the
      PVC labels match app.kubernetes.io/instance=automationhub-storage-{{ _hub_cr_name }}
      and that the operator has finished provisioning file storage for this Hub.

- name: Set hub file-storage PVC fact
  ansible.builtin.set_fact:
    _automationhub_file_storage_pvc: "{{ _automationhub_file_storage_pvcs.resources[0].metadata.name }}"
...
