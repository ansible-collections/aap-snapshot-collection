---
- name: Hub content export
  when: automationhub_export_hub_content | default(true) | bool
  block:
    - name: Set OCP Hub content staging directory
      ansible.builtin.set_fact:
        automationhub_content_staging_dir: "{{ __artifact_build_dir }}/hub"
      when: aap_platform == 'operator'

    - name: Create hub content tarball (RPM)
      community.general.archive:
        path: "{{ automationhub_pulp_data_dir }}/."
        dest: "{{ automationhub_content_staging_dir }}/{{ automationhub_content_tar_name }}"
        format: tar
        mode: '0644'
      become: true
      become_user: pulp
      when: aap_platform == 'rpm'

    - name: Create hub content tarball (containerized)
      when: aap_platform == 'containerized'
      block:
        - name: Get hub container details
          containers.podman.podman_container_info:
            name: automation-hub-api
          register: _automationhub_container

        - name: Resolve hub data path from container mounts
          ansible.builtin.set_fact:
            _automationhub_data_path: >-
              {{ _automationhub_container.containers[0].Mounts
                 | selectattr('Destination', 'equalto', '/var/lib/pulp')
                 | map(attribute='Source') | first }}

        - name: Create hub content tarball from host
          community.general.archive:
            path: "{{ _automationhub_data_path }}/media/."
            dest: "{{ automationhub_content_staging_dir }}/{{ automationhub_content_tar_name }}"
            format: tar
            mode: '0640'

    - name: Check OCP Hub storage backend
      ansible.builtin.include_tasks: check_storage_backend_ocp.yml
      when: aap_platform == 'operator'

    - name: Export Hub content from OCP pod
      when: aap_platform == 'operator'
      environment: "{{ automationhub_ocp_environment }}"
      block:
        - name: Discover Hub file-storage PVC
          ansible.builtin.include_tasks: discover_file_storage_pvc.yml

        - name: Require the selected Hub web pod
          ansible.builtin.assert:
            that:
              - _ocp_utils_hub_export_pod | length > 0
              - _ocp_utils_hub_export_pod.spec.containers | default([]) | length > 0
            fail_msg: >-
              No running web pod was found for Hub CR '{{ _hub_cr_name }}' in
              namespace '{{ automationhub_ocp_namespace }}'. The Hub content
              archive cannot be created.

        - name: Use the selected Hub web pod and its container
          ansible.builtin.set_fact:
            _automationhub_tar_source_pod: "{{ _ocp_utils_hub_export_pod }}"
            _automationhub_tar_source_container: "{{ _ocp_utils_hub_export_pod.spec.containers | first }}"

        - name: Delete previous temporary Hub export deployment
          kubernetes.core.k8s:
            kind: Deployment
            name: "{{ automationhub_temp_export_deployment_name }}"
            namespace: "{{ automationhub_ocp_namespace }}"
            state: absent
            wait: true
            wait_timeout: 120

        - name: Wait for previous temporary Hub export pod to terminate
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: "{{ automationhub_ocp_namespace }}"
            label_selectors:
              - "app={{ automationhub_temp_export_deployment_name }}"
          register: _automationhub_old_export_pods
          until: _automationhub_old_export_pods.resources | length == 0
          retries: 30
          delay: 10

        - name: Create temporary Hub pod with file-storage PVC
          ansible.builtin.include_role:
            name: ansible.aap_snapshot.ocp_utils
            tasks_from: create_temp_resources.yml
          vars:
            ocp_utils_temp_deployment_name: "{{ automationhub_temp_export_deployment_name }}"
            _ocp_utils_create_temp_pvc: false
            _ocp_utils_temp_container_name: "{{ _automationhub_tar_source_container.name }}"
            _ocp_utils_temp_pod_image: "{{ _automationhub_tar_source_container.image }}"
            _ocp_utils_temp_image_pull_policy: "{{ _automationhub_tar_source_container.imagePullPolicy | default('IfNotPresent') }}"
            _ocp_utils_temp_service_account: "{{ _automationhub_tar_source_pod.spec.serviceAccountName | default('default') }}"
            _ocp_utils_temp_pod_security_context: "{{ _automationhub_tar_source_pod.spec.securityContext | default({}) }}"
            _ocp_utils_temp_image_pull_secrets: "{{ _automationhub_tar_source_pod.spec.imagePullSecrets | default([]) }}"
            _ocp_utils_temp_security_context: "{{ _automationhub_tar_source_container.securityContext | default({}) }}"
            _ocp_utils_temp_volume_mounts:
              - name: temporary-data
                mountPath: /tmp
              - name: hub-file-storage
                mountPath: "{{ automationhub_temp_export_mount_path }}"
                readOnly: true
            _ocp_utils_temp_volumes:
              - name: temporary-data
                emptyDir: {}
              - name: hub-file-storage
                persistentVolumeClaim:
                  claimName: "{{ _automationhub_file_storage_pvc }}"

        - name: Create OCP Hub content tarball in temporary Hub pod
          kubernetes.core.k8s_exec:
            namespace: "{{ automationhub_ocp_namespace }}"
            pod: "{{ ocp_utils_temp_pod_name }}"
            container: "{{ _automationhub_tar_source_container.name }}"
            command: >-
              sh -c 'tar -cf /tmp/aap-snapshot-hub-content.tar
              -C "{{ automationhub_temp_export_mount_path }}/media" .;
              result=$?; printf "archive exit code: %s\n" "$result"; exit "$result"'
          register: _automationhub_ocp_content_tar
          failed_when: _automationhub_ocp_content_tar.rc != 0
          changed_when: _automationhub_ocp_content_tar.rc == 0

        - name: Copy OCP Hub content tarball from temporary Hub pod
          kubernetes.core.k8s_cp:
            namespace: "{{ automationhub_ocp_namespace }}"
            pod: "{{ ocp_utils_temp_pod_name }}"
            container: "{{ _automationhub_tar_source_container.name }}"
            remote_path: /tmp/aap-snapshot-hub-content.tar
            local_path: "{{ automationhub_content_staging_dir }}/{{ automationhub_content_tar_name }}"
            state: from_pod

      always:
        - name: Remove temporary OCP Hub content tarball
          kubernetes.core.k8s_exec:
            namespace: "{{ automationhub_ocp_namespace }}"
            pod: "{{ ocp_utils_temp_pod_name }}"
            container: "{{ _automationhub_tar_source_container.name }}"
            command: >-
              sh -c 'rm -f /tmp/aap-snapshot-hub-content.tar;
              result=$?; printf "cleanup exit code: %s\n" "$result"; exit "$result"'
          failed_when: false
          changed_when: false
          when: ocp_utils_temp_pod_name is defined

        - name: Remove temporary Hub pod and deployment
          ansible.builtin.include_role:
            name: ansible.aap_snapshot.ocp_utils
            tasks_from: cleanup_temp_resources.yml
          vars:
            ocp_utils_temp_deployment_name: "{{ automationhub_temp_export_deployment_name }}"
            _ocp_utils_create_temp_pvc: false

    - name: Get hub content tarball checksum
      ansible.builtin.stat:
        path: "{{ automationhub_content_staging_dir }}/{{ automationhub_content_tar_name }}"
        checksum_algorithm: sha256
      register: _automationhub_content_stat

    - name: Add hub content checksum to tracking
      ansible.builtin.set_fact:
        _automationhub_content_exported: true
        _automationhub_db_checksum: |-
          {{ _automationhub_content_stat.stat.checksum }}  hub/{{ automationhub_content_tar_name }}
          {{ _automationhub_db_checksum | default() }}
      when: _automationhub_content_stat.stat.exists | default(false)

    - name: Propagate hub content flag to localhost
      ansible.builtin.set_fact:
        _automationhub_content_exported: true
        artifact_hub_content_filename: "{{ automationhub_content_tar_name }}"
      delegate_to: localhost
      delegate_facts: true
      when: _automationhub_content_stat.stat.exists | default(false)

    - name: Fetch hub content tarball to artifact build dir
      ansible.posix.synchronize:
        mode: pull
        src: "{{ automationhub_content_staging_dir }}/{{ automationhub_content_tar_name }}"
        dest: "{{ __artifact_build_dir }}/hub/{{ automationhub_content_tar_name }}"
      when:
        - _automationhub_content_stat.stat.exists | default(false)
        - aap_platform != 'operator'

    - name: Clean up remote hub content tarball
      ansible.builtin.file:
        path: "{{ automationhub_content_staging_dir }}/{{ automationhub_content_tar_name }}"
        state: absent
      become: true
      when:
        - _automationhub_content_stat.stat.exists | default(false)
        - aap_platform != 'operator'
...
