---
automationhub_ocp_namespace: "{{ ocp_namespace | default('aap') }}"
automationhub_gateway_admin_user: "admin"

automationhub_pulp_data_dir: "/var/lib/pulp/media"
automationhub_content_tar_name: "hub_content.tar"
# Staging directory for the hub content tarball on the remote host.
# Set this to a larger filesystem if /tmp is too small for your hub data.
automationhub_content_staging_dir: "/tmp"
automationhub_export_hub_content: true
automationhub_import_hub_content: true

# Pulp repair task polling configuration (OCP only).
# Total maximum wait = retries * delay (default: 120 * 30 = 3600s = 60 minutes).
automationhub_pulp_repair_retries: 120
automationhub_pulp_repair_delay: 30

automationhub_temp_deployment_name: "{{ ocp_utils_temp_deployment_name | default('aap-snapshot-temp-postgres') }}"
automationhub_temp_pvc_name: "{{ ocp_utils_temp_pvc_name | default('aap-snapshot-temp') }}"

# Kubeconfig resolution for this role's own OCP tasks (import_hub_content.yml,
# reconcile.yml), which cannot rely on ocp_utils_ocp_environment being loaded
# yet. Mirrors roles/ocp_utils/defaults/main.yml.
__automationhub_resolved_kubeconfig: >-
  {{ kubeconfig
     | default(lookup('env', 'K8S_AUTH_KUBECONFIG'), true)
     | default(lookup('env', 'KUBECONFIG'), true)
     | default('', true) }}

automationhub_ocp_environment: >-
  {{ {'K8S_AUTH_KUBECONFIG': __automationhub_resolved_kubeconfig}
     if (__automationhub_resolved_kubeconfig | length > 0)
     else {} }}
...
