---
- name: Select AAP deployment for database Secret discovery
  ansible.builtin.include_tasks: check_aap_cr.yml
  when: _ocp_utils_selected_aap_cr is not defined

- name: Discover and cache component database connection
  when: ocp_pg_component_name not in (_postgresql_ocp_connections | default({}))
  block:
    - name: Read effective component CR for database Secret fallback
      kubernetes.core.k8s_info:
        kind: "{{ _ocp_utils_db_cr_types[ocp_pg_component_name].kind }}"
        api_version: "{{ _ocp_utils_db_cr_types[ocp_pg_component_name].api_version }}"
        namespace: "{{ ocp_utils_ocp_namespace }}"
      vars:
        _ocp_utils_db_cr_types:
          controller:
            kind: AutomationController
            api_version: automationcontroller.ansible.com/v1beta1
          hub:
            kind: AutomationHub
            api_version: automationhub.ansible.com/v1beta1
          eda:
            kind: EDA
            api_version: eda.ansible.com/v1alpha1
      environment: "{{ ocp_utils_ocp_environment }}"
      register: _ocp_utils_db_component_crs
      no_log: "{{ __ocp_utils_no_log }}"
      when: ocp_pg_component_name != 'gateway'

    - name: Resolve component PostgreSQL configuration Secret
      ansible.builtin.set_fact:
        _ocp_utils_resolved_pg_config_secret: >-
          {{ _ocp_utils_selected_aap_cr | ansible.aap_snapshot.postgresql_resolve_secret(
               ocp_pg_component_name, _ocp_utils_db_component_crs.resources | default([])) }}
      no_log: "{{ __ocp_utils_no_log }}"

    - name: Read PostgreSQL configuration Secret
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ _ocp_utils_resolved_pg_config_secret }}"
        namespace: "{{ ocp_utils_ocp_namespace }}"
      environment: "{{ ocp_utils_ocp_environment }}"
      failed_when: _ocp_utils_pg_config_secret.resources | length == 0
      no_log: "{{ __ocp_utils_no_log }}"
      register: _ocp_utils_pg_config_secret

    - name: Validate and cache database connection without admin credentials
      ansible.builtin.set_fact:
        _postgresql_ocp_connections: >-
          {{ (_postgresql_ocp_connections | default({})) | combine({
               ocp_pg_component_name: _ocp_utils_pg_config_secret.resources[0].data
                 | ansible.aap_snapshot.postgresql_decode_secret }) }}
      no_log: "{{ __ocp_utils_no_log }}"

- name: Set component database credential facts from cache
  ansible.builtin.set_fact:
    _ocp_utils_db_settings: "{{ _postgresql_ocp_connections[ocp_pg_component_name] }}"
    _ocp_utils_db_host: "{{ _postgresql_ocp_connections[ocp_pg_component_name].default.HOST }}"
    _ocp_utils_db_port: "{{ _postgresql_ocp_connections[ocp_pg_component_name].default.PORT }}"
    _ocp_utils_db_name: "{{ _postgresql_ocp_connections[ocp_pg_component_name].default.NAME }}"
    _ocp_utils_db_user: "{{ _postgresql_ocp_connections[ocp_pg_component_name].default.USER }}"
    _ocp_utils_db_password: "{{ _postgresql_ocp_connections[ocp_pg_component_name].default.PASSWORD }}"
  no_log: "{{ __ocp_utils_no_log }}"
...
