---
- name: Wait for selected Deployment rollout to complete
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ ocp_utils_ocp_namespace }}"
    label_selectors: "{{ _discover_deployment_selectors | default(_discover_selectors) }}"
  environment: "{{ ocp_utils_ocp_environment }}"
  register: _ocp_utils_discovered_deployment
  until: >-
    _ocp_utils_discovered_deployment.resources | length > 0
    and (_ocp_utils_discovered_deployment.resources[0].status.observedGeneration | default(0) | int)
        >= (_ocp_utils_discovered_deployment.resources[0].metadata.generation | default(0) | int)
    and (_ocp_utils_discovered_deployment.resources[0].status.replicas | default(0) | int)
        == (_ocp_utils_discovered_deployment.resources[0].spec.replicas | default(1) | int)
    and (_ocp_utils_discovered_deployment.resources[0].status.updatedReplicas | default(0) | int)
        == (_ocp_utils_discovered_deployment.resources[0].spec.replicas | default(1) | int)
    and (_ocp_utils_discovered_deployment.resources[0].status.availableReplicas | default(0) | int)
        == (_ocp_utils_discovered_deployment.resources[0].spec.replicas | default(1) | int)
  retries: "{{ _discover_retries | default(30) }}"
  delay: "{{ _discover_delay | default(10) }}"
  when: _discover_wait_for_deployment | default(false) | bool

- name: "Discover pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ ocp_utils_ocp_namespace }}"
    label_selectors: "{{ _discover_selectors }}"
    field_selectors:
      - "status.phase=Running"
  environment: "{{ ocp_utils_ocp_environment }}"
  register: _ocp_utils_discovered_pod
  until: >-
    _ocp_utils_discovered_pod.resources | length > 0
    and (_ocp_utils_discovered_pod.resources[0].status.conditions
         | default([])
         | selectattr('type', 'equalto', 'Ready')
         | selectattr('status', 'equalto', 'True')
         | list | length > 0)
  retries: "{{ _discover_retries | default(30) }}"
  delay: "{{ _discover_delay | default(10) }}"

- name: "Set pod facts"
  ansible.builtin.set_fact:
    "{{ _discover_pod_fact }}": "{{ _ocp_utils_discovered_pod.resources[0].metadata.name }}"
    "{{ _discover_container_fact }}": "{{ _discover_container_name }}"
  when: _ocp_utils_discovered_pod.resources | length > 0
...
