---
- name: Set component config
  ansible.builtin.set_fact:
    _operations_current_component: "{{ _operations_component_config[component_name] }}"

# Pattern 1: Fixed service list (controller, gateway)
- name: "Start static services"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    scope: user
  loop: "{{ _operations_current_component.services }}"
  loop_control:
    label: "{{ item }}"
  when:
    - aap_platform == 'containerized'
    - not (_operations_current_component.has_worker_discovery | bool)

# Pattern 2: Worker discovery + static services (eda, hub)
- name: "Start all services"
  when:
    - aap_platform == 'containerized'
    - _operations_current_component.has_worker_discovery | bool
  block:
    - name: Gather user home directory
      ansible.builtin.setup:
        filter:
          - 'ansible_user_dir'

    - name: "Discover worker and static service units"
      # See the matching comment in stop_service.yml -- discovering static
      # services via `find` (instead of looping the hardcoded static_services
      # list directly) means a since-removed/renamed unit is simply absent
      # from the results instead of hard-failing the whole start with
      # "Could not find the requested service".
      ansible.builtin.find:
        paths: "{{ ansible_user_dir }}/.config/systemd/user"
        patterns: >-
          {{ [_operations_current_component.worker_service_pattern]
             + (_operations_current_component.static_services | map('regex_replace', '$', '.service') | list) }}
        file_type: any
      register: _operations_worker_files

    - name: "Start worker services"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        scope: user
      loop: >-
        {{ _operations_worker_files.files
           | map(attribute='path') | map('basename')
           | map('regex_replace', '\.service$', '')
           | list }}
      loop_control:
        label: "{{ item }}"
...
