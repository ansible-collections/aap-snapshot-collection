---
- name: Containerized database import
  when: aap_platform == 'containerized'
  block:
    # Containerized hosts don't reliably have a real pg_restore binary -
    # run it inside our own throwaway client container instead.
    - name: Create temp postgres client container for restore
      ansible.builtin.include_tasks: create_temp_container.yml
      vars:
        postgresql_temp_container_volumes:
          - "{{ postgresql_restore_source }}:{{ postgresql_restore_source }}:ro,Z"

    # Restore into the existing database (--no-owner, no --create),
    # matching the OCP path - avoids DROP DATABASE's exclusive-access
    # requirement, which has no force option and is racy against
    # lingering connections (worker shutdown timing, autovacuum).
    # Uses discovered credentials from postgresql_auth_settings (set by
    # get_db_credentials.yml before services were stopped).
    - name: "Restore database"
      containers.podman.podman_container_exec:
        name: "{{ postgresql_temp_container_name }}"
        user: "{{ ansible_effective_user_id }}"
        argv:
          - pg_restore
          - --clean
          - --if-exists
          - --no-owner
          - -h
          - "{{ postgresql_auth_settings.default.HOST }}"
          - -p
          - "{{ postgresql_auth_settings.default.PORT | string }}"
          - -U
          - "{{ postgresql_auth_settings.default.USER }}"
          - -d
          - "{{ postgresql_auth_settings.default.NAME }}"
          - "{{ postgresql_restore_source }}"
        env:
          PGPASSWORD: "{{ postgresql_auth_settings.default.PASSWORD }}"
      # pg_restore --clean itself only warns on "cannot drop inherited
      # constraint" for partitioned tables - match OCP's leniency.
      register: _postgresql_restore_result
      failed_when: _postgresql_restore_result.rc != 0 and 'FATAL' in (_postgresql_restore_result.stderr | default(''))
      no_log: "{{ __postgresql_no_log }}"
      async: '{{ postgresql_restore_timeout }}'
      poll: 30
  rescue:
    # Re-raise so the outer block in consume.yml triggers service recovery
    # instead of continuing into secret rotation and container removal.
    - name: Re-raise database restore failure
      ansible.builtin.fail:
        msg: >-
          Database restore failed for {{ postgresql_component_name }}: {{
          ansible_failed_result.msg | default(ansible_failed_result | to_nice_json) }}
  always:
    - name: Remove temp postgres client container
      ansible.builtin.include_tasks: remove_temp_container.yml

- name: OCP database import
  when: aap_platform == 'operator'
  environment: "{{ postgresql_ocp_environment }}"
  block:
    - name: Get postgres auth credentials
      ansible.builtin.include_tasks: db_auth.yml

    - name: "Restore database"
      kubernetes.core.k8s_exec:
        namespace: '{{ postgresql_ocp_namespace }}'
        pod: '{{ ocp_utils_temp_pod_name }}'
        container: postgres
        command: >-
          sh -c 'PGPASSWORD="{{ postgresql_auth_settings.default.PASSWORD }}"
          pg_restore --clean --if-exists --no-owner
          -h {{ postgresql_auth_settings.default.HOST }}
          -p {{ postgresql_auth_settings.default.PORT }}
          -U {{ postgresql_auth_settings.default.USER }}
          -d {{ postgresql_auth_settings.default.NAME }}
          /tmp/migration/artifact/{{ postgresql_component_name }}/{{ postgresql_component_name }}.pgc'
      failed_when: _postgresql_restore_result.rc != 0 and 'FATAL' in (_postgresql_restore_result.stderr | default(''))
      no_log: "{{ __postgresql_no_log }}"
      register: _postgresql_restore_result
...
