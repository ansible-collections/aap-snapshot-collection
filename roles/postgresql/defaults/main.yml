---
__postgresql_no_log: "{{ not (disable_no_log | default(false) | bool) }}"

# OCP namespace (read from user-facing var, independent of ocp_utils)
postgresql_ocp_namespace: "{{ ocp_namespace | default('aap') }}"

# Auth variables
postgresql_django_manage_get_cmd: "from django.conf import settings; print(settings.DATABASES)"

# Export directory variables
postgresql_export_dir: "/tmp/backups/automation-platform"
postgresql_export_dest: "{{ lookup('env', 'PWD') }}/db_export"
postgresql_export_extension: "pgc"

# Import variables
postgresql_restore_timeout: 3600

# Temp container variables (used to run pg_dump/pg_restore without requiring
# postgres client tools on the target host - see create_temp_container.yml)
postgresql_temp_container_name: "aap-snapshot-{{ postgresql_component_name }}"
postgresql_temp_container_volumes: []
postgresql_discover_container_name: "postgresql"

# Image used for the temporary postgres client container on containerized
# targets. Matches the image the OCP path's own temporary migration pod
# defaults to (ocp_utils_temp_postgres_image). Override this directly if
# your target's PostgreSQL server version differs.
postgresql_temp_container_image: "registry.redhat.io/rhel9/postgresql-15:latest"

# Kubeconfig resolution for this role's own OCP tasks (db_export.yml,
# db_import.yml), which cannot rely on ocp_utils_ocp_environment being loaded
# yet. Mirrors roles/ocp_utils/defaults/main.yml.
__postgresql_resolved_kubeconfig: >-
  {{ kubeconfig
     | default(lookup('env', 'K8S_AUTH_KUBECONFIG'), true)
     | default(lookup('env', 'KUBECONFIG'), true)
     | default('', true) }}

postgresql_ocp_environment: >-
  {{ {'K8S_AUTH_KUBECONFIG': __postgresql_resolved_kubeconfig}
     if (__postgresql_resolved_kubeconfig | length > 0)
     else {} }}
...
